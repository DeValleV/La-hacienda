# Copia este archivo como `wrangler.toml` y reemplaza cada valor REEMPLAZAR_*
# con los recursos de TU cuenta de Cloudflare. `wrangler.toml` no se versiona.
name = "REEMPLAZAR_CON_NOMBRE_DE_WORKER"
main = "src/worker.js"
compatibility_date = "2026-09-08"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "REEMPLAZAR_CON_NOMBRE_D1_PRODUCCION"
database_id = "REEMPLAZAR_CON_UUID_D1_PRODUCCION"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PRODUCT_IMAGES"
bucket_name = "REEMPLAZAR_CON_BUCKET_R2_PRODUCCION"

[observability]
enabled = true

[env.staging]
name = "REEMPLAZAR_CON_NOMBRE_DE_WORKER_STAGING"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "REEMPLAZAR_CON_NOMBRE_D1_STAGING"
database_id = "REEMPLAZAR_CON_UUID_D1_STAGING"
migrations_dir = "migrations"

[[env.staging.r2_buckets]]
binding = "PRODUCT_IMAGES"
bucket_name = "REEMPLAZAR_CON_BUCKET_R2_STAGING"

[env.staging.observability]
enabled = true
