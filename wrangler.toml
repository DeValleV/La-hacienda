name = "la-hacienda"
main = "src/worker.js"
compatibility_date = "2026-09-08"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "la-hacienda"
database_id = "REPLACE_WITH_PRODUCTION_DATABASE_ID"
migrations_dir = "migrations"

[observability]
enabled = true

[env.staging]
name = "la-hacienda-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "la-hacienda-staging"
database_id = "REPLACE_WITH_STAGING_DATABASE_ID"
migrations_dir = "migrations"

[env.staging.observability]
enabled = true
